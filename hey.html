
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Accessible To-Do List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
      text-align: center;
      justify-content: center;
    }
    header {
      background-color: #00274d;
      color: white;
      padding: 10px;
      text-align: center;
    }
    nav a {
      margin: 0 10px;
      color: #00274d;
      text-decoration: none;
      font-weight: bold;
      margin-top: 20px;
    }
    .instructions, .tasks {
      margin-top: 20px;
    }
    .task-input {
      margin-top: 10px;
    }
    .task-input input {
      padding: 5px;
      width: 200px;
    }
    .task-input button {
      padding: 5px 10px;
      background-color: #00274d;
      color: white;
      border: none;
    }
    ul {
      margin-top: 10px;
      list-style-type: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Accessible To-Do List</h1>
  </header>
  <nav style="margin-top: 20px; font-size: 30px;">
    <a href="#">Home</a>
    <a href="#instruc">Instructions</a>
    <a href="#tasks">My Tasks</a>
  </nav>

  <div class="instructions" id="instruc" style="background-color: bisque; border-radius: 15px; padding: 100px; text-align: start;"> 
    <h2>Instructions</h2>
    <p>Use the form below to add tasks. Use the keyboard (Tab/Enter) to navigate and interact.</p>
  </div>

  <div class="tasks" id="tasks" style="background-color: bisque; border-radius: 15px; padding: 100px; text-align: start;">
    <h2>My Tasks</h2>
    <div class="task-input">
      <input type="text" id="taskInput" placeholder="Enter task" />
      <button onclick="addTask()">Add Task</button>
    </div>
    <ul id="taskList">
      <li>✔️ "vacuum" added.</li>
    </ul>
  </div>

  <script>
    function addTask() {
      const input = document.getElementById('taskInput');
      const taskText = input.value.trim();
      if (taskText) {
        const li = document.createElement('li');
        li.textContent = `✔️ "${taskText}" added.`;
        document.getElementById('taskList').appendChild(li);
        input.value = '';
      }
    }
  </script>
</body>
</html>
